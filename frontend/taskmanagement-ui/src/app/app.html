<div class="shell" [class.collapsed]="collapsed()" [class.mobile-open]="mobileOpen()">
  <button class="scrim" aria-label="Close navigation" (click)="mobileOpen.set(false)"></button>
  <aside class="sidebar" aria-label="Main navigation">
    <a class="brand" routerLink="/dashboard" (click)="mobileOpen.set(false)">
      <span class="brand-icon">P</span>
      <span class="brand-copy"><strong>ProjectFlow</strong><small>Project Management</small></span>
    </a>
    <div class="nav-caption">WORKSPACE</div>
    <nav class="side-nav">
      <a routerLink="/dashboard" routerLinkActive="active"><span class="nav-icon">▦</span><span class="nav-text">Dashboard</span></a>
      <a routerLink="/projects" routerLinkActive="active"><span class="nav-icon">▤</span><span class="nav-text">Projects</span></a>
      <a routerLink="/tasks" routerLinkActive="active"><span class="nav-icon">☑</span><span class="nav-text">Tasks</span></a>
      <a routerLink="/categories" routerLinkActive="active"><span class="nav-icon">◈</span><span class="nav-text">Categories</span></a>
    </nav>
    <div class="sidebar-footer"><span class="status-dot"></span><span class="nav-text">Project workspace</span></div>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-toggle" type="button" (click)="toggleMenu()" aria-label="Toggle sidebar" [attr.aria-expanded]="mobileOpen()">☰</button>
        <div><div class="topbar-title">{{ title() }}</div><div class="topbar-subtitle">Project & Task Management System</div></div>
      </div>
      <span class="workspace-tag">Workspace</span>
    </header>
    <main class="content"><router-outlet /></main>
  </div>
</div>
